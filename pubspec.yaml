name: aws_liveness_for_flutter
description: "Native Amazon Rekognition Face Liveness for Flutter on iOS and Android, built on the official AWS Amplify Face Liveness SDKs. No WebView, no Cognito required."
version: 0.0.1
homepage: https://github.com/mertcandanzz/aws_liveness_for_flutter
repository: https://github.com/mertcandanzz/aws_liveness_for_flutter
issue_tracker: https://github.com/mertcandanzz/aws_liveness_for_flutter/issues
topics:
  - aws
  - liveness
  - biometrics
  - face-detection
  - rekognition

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^27.3.0
  fake_async: ^1.3.3

flutter:
  plugin:
    platforms:
      android:
        package: io.github.mertcandanzz.aws_liveness_for_flutter
        pluginClass: AwsLivenessForFlutterPlugin
      ios:
        pluginClass: AwsLivenessForFlutterPlugin
