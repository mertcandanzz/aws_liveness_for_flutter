version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pub
    directory: /example
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      amplify:
        patterns:
          - "com.amplifyframework*"

  - package-ecosystem: swift
    directory: /ios/aws_liveness_for_flutter
    schedule:
      interval: weekly
    groups:
      amplify:
        patterns:
          - "*amplify*"

  - package-ecosystem: npm
    directory: /examples/backend-express
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"

  - package-ecosystem: npm
    directory: /examples/backend-lambda
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      aws-cdk:
        patterns:
          - "aws-cdk"
          - "aws-cdk-lib"
          - "constructs"

  - package-ecosystem: npm
    directory: /examples/cognito
    schedule:
      interval: weekly
    groups:
      aws-cdk:
        patterns:
          - "aws-cdk"
          - "aws-cdk-lib"
          - "constructs"

  - package-ecosystem: pub
    directory: /examples/cognito/flutter_client
    schedule:
      interval: weekly
    groups:
      amplify:
        patterns:
          - "amplify_*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
