# Local-only until workflow scope is granted; no GitHub execution has been verified.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  COVERAGE_MIN: '95'
  # Raise to 160 after Linux proves the dartdoc section; see the open P6 P2 card.
  PANA_MIN_SCORE: '150'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  dart:
    name: Dart (Flutter ${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 3.38.x
            flutter-version: 3.38.7
          - label: stable
            flutter-version: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - name: Check CI gate arithmetic and failure cases
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - run: flutter pub get
      - name: Resolve the nested snippet before repository-wide analysis
        working-directory: examples/cognito/flutter_client
        run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Enforce handwritten Dart line coverage
        run: python3 .github/scripts/ci_gate.py coverage coverage/lcov.info
      - name: Test the example
        working-directory: example
        run: |
          flutter pub get
          flutter test
      - name: Check all three Pigeon outputs
        run: bash .github/scripts/check_pigeon.sh
      - name: Generate API documentation without warnings
        run: |
          dart doc 2>&1 | tee "$RUNNER_TEMP/dartdoc.log"
          grep -F 'Found 0 warnings and 0 errors.' "$RUNNER_TEMP/dartdoc.log"
      - name: Enforce pana score on an isolated source snapshot
        run: bash .github/scripts/check_pana.sh
      - name: Validate the pub archive without publishing
        run: flutter pub publish --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dart-reports-${{ matrix.label }}
          path: |
            coverage/lcov.info
            ${{ runner.temp }}/pana.json
            ${{ runner.temp }}/dartdoc.log
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android (host Kotlin ${{ matrix.kotlin }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kotlin: ['2.1.0', '2.2.20']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Select host Kotlin (the plugin reads this version)
        env:
          HOST_KOTLIN: ${{ matrix.kotlin }}
        run: python3 .github/scripts/ci_gate.py kotlin example/android/settings.gradle.kts "$HOST_KOTLIN"
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter config --jdk-dir "$JAVA_HOME"
      - run: flutter pub get
      - name: Build debug and R8 release, including merged camera-feature gates
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug
          flutter build apk --release
      - name: JVM tests, Android lint and explicit camera-feature gates
        working-directory: example/android
        # The checked-in wrapper need not have its executable bit set on Windows.
        run: >-
          bash gradlew :aws_liveness_for_flutter:testDebugUnitTest
          :aws_liveness_for_flutter:lintDebug
          :app:verifyDebugCameraFeatures :app:verifyReleaseCameraFeatures
          --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-kotlin-${{ matrix.kotlin }}
          path: |
            build/aws_liveness_for_flutter/reports/
            build/aws_liveness_for_flutter/test-results/
            example/build/aws_liveness_for_flutter/reports/
            example/build/aws_liveness_for_flutter/test-results/
          if-no-files-found: ignore
          retention-days: 7

  ios-swift-linux:
    name: iOS core on Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        swift: ['5.10', '6.1']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse Apple adapters and run platform-free XCTest
        env:
          SWIFT_IMAGE: swift:${{ matrix.swift }}-jammy
          AWS_LIVENESS_EXPECT_SDK: '0'
        run: bash tool/ios_linux_check.sh

  ios-spm:
    name: iOS SwiftPM (Flutter ${{ matrix.label }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 3.38.x
            flutter-version: 3.38.7
          - label: stable
            flutter-version: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - name: Cache SwiftPM downloads (not build products or DerivedData)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ matrix.label }}-${{ hashFiles('ios/**/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-${{ matrix.label }}-
      - run: flutter config --enable-swift-package-manager
      - name: Build the example for the simulator
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --simulator --debug --no-codesign
      - name: Run RunnerTests on a simulator with FaceLiveness linked
        working-directory: example
        env:
          # xcodebuild forwards TEST_RUNNER_* without the prefix to the test process.
          TEST_RUNNER_AWS_LIVENESS_EXPECT_SDK: '1'
        run: bash ../.github/scripts/ios_xctest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-spm-tests-${{ matrix.label }}
          path: ${{ runner.temp }}/RunnerTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ios-cocoapods:
    name: iOS CocoaPods fallback (sdkUnavailable)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/*.podspec', 'example/pubspec.lock') }}
      - run: flutter config --no-enable-swift-package-manager
      - name: Create a Podfile for iOS 15
        working-directory: example
        run: |
          flutter_root="$(dirname "$(dirname "$(command -v flutter)")")"
          cp "$flutter_root/packages/flutter_tools/templates/cocoapods/Podfile-ios" ios/Podfile
          sed -i '' "s/^# platform :ios, .*/platform :ios, '15.0'/" ios/Podfile
          grep -q "^platform :ios, '15.0'" ios/Podfile
      - name: Build the fallback for the simulator
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --simulator --debug --no-codesign
      - name: Run RunnerTests and assert the sdkUnavailable fallback
        working-directory: example
        env:
          TEST_RUNNER_AWS_LIVENESS_EXPECT_SDK: '0'
        run: bash ../.github/scripts/ios_xctest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-cocoapods-tests
          path: ${{ runner.temp }}/RunnerTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  backends:
    name: ${{ matrix.project }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
        project: [backend-express, backend-lambda, cognito]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: examples/${{ matrix.project }}/package-lock.json
      - name: Check backend without AWS credentials or deployment
        working-directory: examples/${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          # Remove inherited AWS/CDK config; synth-check never uses the CDK CLI.
          while IFS= read -r variable; do
            unset "$variable"
          done < <(compgen -e | grep -E '^(AWS_|CDK_)' || true)
          node --version
          npm ci
          npm run lint
          npm run typecheck
          npm test
          if [[ "$PROJECT" != backend-express ]]; then
            npm run synth
          fi

  cognito-client:
    name: Cognito Flutter snippet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true
      - working-directory: examples/cognito/flutter_client
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
